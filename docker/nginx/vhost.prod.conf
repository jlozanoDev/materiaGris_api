# Plantilla de server block para produccion.
# ${PORT} se sustituye en runtime con envsubst ( Railway injecta PORT ).
# El resto de variables nginx ($uri, $query_string, ...) se preservan listando solo ${PORT} en envsubst.

server {
    listen ${PORT};
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~* \.(jpg|jpeg|gif|css|png|js|ico|webp|tif|ttf|svg|woff|woff2)$ {
        expires max;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 180s;
        internal;
    }

    location ~ /\.ht {
        deny all;
    }
}